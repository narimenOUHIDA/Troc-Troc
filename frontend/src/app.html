<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Typographies de la charte graphique (docs/conception/charte (1).pdf) : Poppins pour les
		     titres, Inter pour le texte courant (voir app.css). -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Pose data-theme AVANT le premier paint (script bloquant, exécuté avant le CSS de la page)
			// pour éviter un flash du mauvais thème au chargement. Rien à faire si aucune préférence
			// n'a été enregistrée : app.css bascule alors automatiquement via prefers-color-scheme.
			(function () {
				try {
					var theme = localStorage.getItem('theme');
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.dataset.theme = theme;
					}
				} catch (error) {
					// localStorage indisponible (navigation privée stricte, etc.) : on reste sur le thème système.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
